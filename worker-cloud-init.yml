#cloud-config

ssh_deletekeys: true
ssh_genkeytypes:
  - ed25519
  - ecdsa
  - rsa

package_update: true
packages:
  - git
  - openssh-server
  - openssh-client
  - python3
  - python3-venv
  - python3-pip
  - openmpi-bin
  - libopenmpi-dev

runcmd:
  - systemctl restart ssh || systemctl restart sshd
  - mkdir -p /opt/pw-lxd
  - git clone git@github.com:mesny/pw-lxd.git /opt/pw-lxd
  - cd /opt/pw-lxd && git checkout main
  - python3 -m venv /opt/pw-lxd/venv
  - /opt/pw-lxd/venv/bin/pip install --upgrade pip
  - test ! -f /opt/pw-lxd/requirements.txt || /opt/pw-lxd/venv/bin/pip install -r /opt/pw-lxd/requirements.txt